<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <link rel="icon"
          type="image/x-icon"
          href="img/Logo/logo.img.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inika:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:wght@400;500;700;900&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         HEADER SECTION
    ========================== -->

    <div class="header" id="header">

        <!-- Logo -->
        <span class="logo">A.J</span>

        <!-- Navigation Links -->
        <div class="nav">

            <a href="#home">HOME</a>
            <a href="#about">ABOUT</a>
            <a href="#gallery">GALLERY</a>
            <a href="#hobbies">HOBBIES</a>
            <a href="#contact">CONTACT</a>

        </div>

    </div>


    <!-- =========================
         HOME SECTION
    ========================== -->

    <div class="home" id="home">

        <h4 class="intro">
            Hello, We Are
        </h4>

        <h1 class="team">
            TEAM A.J
        </h1>

        <h4 class="category">
            Web Designer
        </h4>

    </div>


    <!-- =========================
         ABOUT SECTION
    ========================== -->

    <div class="about" id="about">

        <h3 class="title">
            ABOUT SECTION
        </h3>


        <!-- FIRST PROFILE -->

        <div class="profile">

            <img src="img/profile/profile1.jpg"
                 alt="Angel Ann Napalliaton">

            <div class="bio">

                <h3 class="name">
                    Angel Ann Napalliaton
                </h3>

                <p class="row">
                    Confused Web Designer
                </p>

                <p class="decription">
                    Curreently Married
                </p>

            </div>

        </div>


        <!-- SECOND PROFILE -->

        <div class="profile">

            <img src="img/profile/profile2.jpg"
                 alt="Shinrey James De Asis">

            <div class="bio">

                <h3 class="name">
                    Shinrey James De Asis
                </h3>

                <p class="row">
                    Lazy Web Designer
                </p>

                <p class="decription">
                    Curreently Not Racist
                </p>

            </div>

        </div>

    </div>
    <!-- IMPORTANT: ABOUT SECTION ENDS HERE -->


    <!-- =========================
         GALLERY SECTION
    ========================== -->

    <div class="gallery" id="gallery">

        <h3 class="title gallery-title">
            GALLERY
        </h3>

        <div class="photos">

            <div class="image">
                <img src="img/gallery/gallery1.jpg" alt="Gallery Photo 1">
            </div>

            <div class="image">
                <img src="img/gallery/gallery2.jpg" alt="Gallery Photo 2">
            </div>

            <div class="image">
                <img src="img/gallery/gallery3.jpg" alt="Gallery Photo 3">
            </div>

            <div class="image">
                <img src="img/gallery/gallery4..jpg" alt="Gallery Photo 4">
            </div>

            <div class="image">
                <img src="img/gallery/gallery5.jpg" alt="Gallery Photo 5">
            </div>

            <div class="image">
                <img src="img/gallery/gallery6.jpg" alt="Gallery Photo 6">
            </div>

        </div>

    </div>


    <!-- =========================
         CONTACT SECTION
    ========================== -->

    <div class="contact" id="contact">

        <h3 class="title">
            CONTACTS
        </h3>

        <div class="contact-info">

            <!-- PHONE ICON -->

            <div class="icon">

                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     class="lucide lucide-phone">

                    <path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.463A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A16 16 0 0 1 4 6a2 2 0 0 1-2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>

                </svg>

            </div>


            <!-- PHONE NUMBER INFORMATION -->

            <div class="info">

                <label for="mobile">
                    Mobile Number
                </label>

                <h1 id="mobile">
                    09468169505
                </h1>

            </div>
            <div class="info">

                <label for="mobile">
                   Email Address
                </label>

                <h1 id="mobile">
                    shinreyjamesdeasis@gmail.com
                </h1>

            </div>


        </div>

    </div>


</body>
</html>
